name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          tags: opendv:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Unit tests
        run: docker run --rm -v "$PWD":/src -w /src opendv:ci python -m pytest -q
      - name: Regbus example regression (random seeds; the master seed is printed)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD":/src -w /src/examples/regbus \
            opendv:ci opendv regress --all --seeds 4 --code-cov
      - name: Keep the dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: examples/regbus/regress
          if-no-files-found: ignore
