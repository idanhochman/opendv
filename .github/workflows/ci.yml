name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          tags: opendv:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Unit tests
        run: docker run --rm -v "$PWD":/src -w /src opendv:ci python -m pytest -q
      - name: Regbus example regression (random seeds; the master seed is printed)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD":/src -w /src/examples/regbus \
            opendv:ci opendv regress --all --seeds 4 --code-cov
      - name: Keep the dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: examples/regbus/regress
          if-no-files-found: ignore

  # Publish the toolchain image to GitHub's container registry (ghcr.io) once the tests pass.
  # main -> :edge; a v0.1.0 tag -> :0.1.0, :0.1 and :latest. Never runs for pull requests.
  publish:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/idanhochman/opendv
          tags: |
            type=edge
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
